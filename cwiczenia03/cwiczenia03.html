<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Społeczność</title>
        <link rel="stylesheet" href="css/styl.css">
    </head>
    <body>
        <header>
            <h1>Społeczność</h1>
            <nav>
                <a href="#artykul1">link 1</a>
                <a href="#artykul1">link 2</a>
                <a href="#artykul1">link 3</a>
            </nav>
        </header>
        <main>
            <article id="artykul1">
                <h2>Artykul jeden</h2>
                <p><strong>paragraf</strong> jeden</p>
                <p>paragraf <em>dwa</em></p>
                <ul>
                    <li>to</li>
                    <li>jest</li>
                    <li>lista</li>
                </ul>
                <figure>
                    <img src="fikcyjny_obraz.png" alt="wazny obrazek">
                    <figcaption>To jest bardzo wazne zdjecie</figcaption>
                </figure>
            </article>
            <article id="artykul2">
                <h2>Artykul dwa</h2>
                <p><strong>paragraf</strong> jeden</p>
                <p>paragraf <em>dwa</em></p>
                <table>
                    <caption>tytuł tabeli</caption>
                    <tr><th>Kolumna 1</th><th>kolumna 2</th></tr>
                    <tr><td>tresc 1</td><td>tresc 2</td></tr>
                    <tr><td>tresc 3</td><td>tresc 4</td></tr>
                    <tr><td>tresc 5</td><td>tresc 6</td></tr>
                    <tr><td>tresc 7</td><td>tresc 8</td></tr>
                </table>
                <form>
                    <label for="email">Podaj e-mail: <input type="email" id="email" required></label><br>
                    <label for="imie">Podaj imie: <input type="text" id="imie"></label>
                    <button>Przycisk</button>
                    <details>
                        <summary>Pytanie FAQ </summary>
                        <p>Tutaj znajduje sie jakas odpowiedz</p>
                    </details>
                </form>
            </article>
        </main>
        <footer><p>stopka</p></footer>
    </body>
</html>
